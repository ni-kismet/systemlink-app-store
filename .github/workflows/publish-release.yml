name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
  workflow_dispatch:
    inputs:
      submission:
        description: 'Submission directory name (under submissions/)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  detect:
    name: Detect submissions to publish
    runs-on: ubuntu-latest
    outputs:
      submissions: ${{ steps.detect.outputs.submissions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed submissions
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SUBMISSION: ${{ inputs.submission }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SUBMISSIONS=$(echo "$INPUT_SUBMISSION" | jq -R -s -c '[.]')
          else
            # Detect submission directories changed in this push.
            # Exclude systemlink-plugin-manager (published by publish-webapp pipeline).
            SUBMISSIONS=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" \
              | grep '^submissions/' \
              | cut -d'/' -f2 \
              | sort -u \
              | grep -v '^systemlink-plugin-manager$' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "submissions=$SUBMISSIONS" >> "$GITHUB_OUTPUT"
          echo "Will publish: $SUBMISSIONS"

  publish:
    name: Publish ${{ matrix.submission }}
    needs: detect
    if: ${{ needs.detect.outputs.submissions != '[]' && needs.detect.outputs.submissions != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submission: ${{ fromJson(needs.detect.outputs.submissions) }}
    env:
      SUBMISSION_NAME: ${{ matrix.submission }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate release artifact
        id: artifact
        run: |
          DIR="submissions/${SUBMISSION_NAME}"
          if [ ! -f "$DIR/manifest.json" ]; then
            echo "✗ No manifest.json found in $DIR" >&2
            exit 1
          fi

          EXPLICIT=$(jq -r '.nipkgFile' "$DIR/manifest.json")
          FOUND=""

          if [ -n "$EXPLICIT" ] && [ -f "$DIR/$EXPLICIT" ]; then
            FOUND="$DIR/$EXPLICIT"
          fi

          if [ -n "$FOUND" ]; then
            echo "build_webapp=false" >> "$GITHUB_OUTPUT"
            echo "path=$FOUND" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$FOUND")" >> "$GITHUB_OUTPUT"
          elif [ "$SUBMISSION_NAME" = "systemlink-plugin-manager" ]; then
            echo "build_webapp=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ No .nipkg artifact found in $DIR for manifest nipkgFile=$EXPLICIT" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.artifact.outputs.build_webapp == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        if: steps.artifact.outputs.build_webapp == 'true'
        run: npm ci
        working-directory: webapp

      - name: Build webapp
        if: steps.artifact.outputs.build_webapp == 'true'
        run: npm run build
        working-directory: webapp

      - name: Package Plugin Manager for SystemLink webapp
        if: steps.artifact.outputs.build_webapp == 'true'
        id: build_nipkg
        run: |
          rm -rf dist/nipkg
          npx -y @ni-kismet/sl-webapp-nipkg@1.1.0 build \
            --config nipkg.config.json \
            --output-dir dist/nipkg
          NIPKG=$(find dist/nipkg -maxdepth 1 -name '*.nipkg' | head -1)
          if [ -z "$NIPKG" ]; then
            echo "✗ Packaging did not produce a .nipkg file" >&2
            exit 1
          fi
          # Output paths relative to repo root for subsequent steps
          echo "path=webapp/$NIPKG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$NIPKG")" >> "$GITHUB_OUTPUT"
        working-directory: webapp

      - name: Select release artifact
        id: release_artifact
        run: |
          if [ "${{ steps.artifact.outputs.build_webapp }}" = "true" ]; then
            echo "path=${{ steps.build_nipkg.outputs.path }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ steps.build_nipkg.outputs.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.artifact.outputs.path }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ steps.artifact.outputs.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read package metadata
        id: package_metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from submission_utils import extract_control_fields, metadata_from_control_fields

          artifact = Path("${{ steps.release_artifact.outputs.path }}")
          control_fields = extract_control_fields(artifact)
          metadata = metadata_from_control_fields(control_fields)

          print(f"package={metadata['package']}")
          print(f"version={metadata['version']}")
          print(f"display_name={metadata['displayName']}")
          print(f"tag={metadata['package']}-v{metadata['version']}")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.package_metadata.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.package_metadata.outputs.tag }}" \
              "${{ steps.release_artifact.outputs.path }}" \
              --clobber
          else
            gh release create "${{ steps.package_metadata.outputs.tag }}" \
              "${{ steps.release_artifact.outputs.path }}" \
              --title "${{ steps.package_metadata.outputs.display_name }} v${{ steps.package_metadata.outputs.version }}" \
              --notes "Release of ${{ steps.package_metadata.outputs.display_name }} version ${{ steps.package_metadata.outputs.version }}" \
              --latest=false
          fi

      - name: Trigger index rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run rebuild-index.yml --ref main
