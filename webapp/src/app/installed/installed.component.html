<app-permission-banner [hasPermission]="hasPermission"></app-permission-banner>

<div class="installed-header">
  <h2>Installed Apps</h2>
</div>

<div *ngIf="loading" class="loading-container">
  <nimble-spinner></nimble-spinner>
  <span>Loading installed apps…</span>
</div>

<nimble-banner *ngIf="error" severity="error" [open]="true">
  {{ error }}
</nimble-banner>

<div *ngIf="!loading && entries.length === 0 && !error" class="empty-state">
  <p>No apps installed in any readable workspace yet.</p>
  <nimble-button appearance="outline" (click)="router.navigate(['/catalog'])">Browse Catalog</nimble-button>
</div>

<div *ngIf="!loading && entries.length > 0">
  <nimble-toolbar class="installed-toolbar" *ngIf="hasPermission">
    <nimble-button
      *ngIf="hasSelectedRows"
      slot="start"
      appearance="ghost"
      (click)="upgradeSelected()"
      [disabled]="!canUpgradeSelected">
      Upgrade
    </nimble-button>

    <nimble-button
      *ngIf="hasSelectedRows"
      slot="start"
      appearance="ghost"
      (click)="uninstallSelected()"
      [disabled]="!canUninstallSelected">
      Uninstall
    </nimble-button>

    <nimble-button
      *ngIf="!hasSelectedRows"
      slot="start"
      appearance="outline"
      (click)="upgradeAll()"
      [disabled]="!canUpgradeAll">
      {{ upgradingAll ? 'Upgrading…' : 'Upgrade All (' + upgradesAvailable + ')' }}
    </nimble-button>
  </nimble-toolbar>

  <nimble-table
    id-field-name="packageName"
    selection-mode="multiple"
    [data$]="tableRows$"
    (selection-change)="onTableSelectionChange($event)">
    <nimble-table-column-anchor
      field-name="displayName"
      label-field-name="displayName"
      href-field-name="detailHref"
      (click)="onAnchorColumnClick($event)">
      App
    </nimble-table-column-anchor>
    <nimble-table-column-text field-name="installedVersion">Installed</nimble-table-column-text>
    <nimble-table-column-text field-name="availableVersion">Available</nimble-table-column-text>
    <nimble-table-column-text field-name="type">Type</nimble-table-column-text>
    <nimble-table-column-text field-name="workspaces">Workspaces</nimble-table-column-text>
    <nimble-table-column-text field-name="lastActivity">Last Activity</nimble-table-column-text>
  </nimble-table>
</div>
