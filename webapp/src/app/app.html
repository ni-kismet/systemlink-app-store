<nimble-theme-provider [theme]="currentTheme">
  <nimble-label-provider-core withDefaults></nimble-label-provider-core>
  <div class="app-shell">
    <nimble-anchor-tabs class="app-tabs" [activeid]="activeTabId">
      <nimble-anchor-tab id="catalog" nimbleRouterLink="/catalog">Catalog</nimble-anchor-tab>
      <nimble-anchor-tab id="installed" nimbleRouterLink="/installed">Installed</nimble-anchor-tab>
      <nimble-anchor-tab id="settings" nimbleRouterLink="/settings">Settings</nimble-anchor-tab>
    </nimble-anchor-tabs>
    <main class="app-content">
      <nimble-banner *ngIf="mockPhase" class="mock-phase-banner" severity="information" [open]="true">
        Mock lifecycle phase active: {{ mockPhaseLabel }}.
        Use <strong>?mockPhase=not-onboarded</strong>, <strong>catalog</strong>, <strong>installed</strong>, or <strong>upgrade</strong> to switch states quickly.
      </nimble-banner>
      <router-outlet></router-outlet>
    </main>
  </div>
</nimble-theme-provider>
